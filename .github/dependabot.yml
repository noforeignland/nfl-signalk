version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Pacific/Auckland
    open-pull-requests-limit: 10
    # The release-please gate releases a runtime dependency bump, which is
    # `build(deps)`, and not a dev dependency bump, which is `build(deps-dev)`.
    commit-message:
      prefix: build
      prefix-development: build
      include: scope
    labels:
      - dependencies
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    ignore:
      # typescript-eslint does not support TypeScript 7.0, so lint would fail.
      - dependency-name: typescript
        versions: ['7.0.x']
      # node-fetch@3+ is ESM-only; this project compiles to CommonJS.
      # Pinned to v2.x intentionally — see src/lib/TrackSender.ts.
      - dependency-name: node-fetch
        update-types: [version-update:semver-major]
      - dependency-name: '@types/node-fetch'
        update-types: [version-update:semver-major]
      # Keep @types/node aligned with the lowest supported runtime (Node 20 on
      # Victron Cerbo GX) so TypeScript rejects APIs that don't exist there.
      # Bumping past 20 lets code typecheck against newer Node APIs that crash
      # on the boat. See engines.node and @tsconfig/node20.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Pacific/Auckland
    open-pull-requests-limit: 5
    # An action bump changes nothing users get, so it is not a releasable one.
    commit-message:
      prefix: ci
      include: scope
    labels:
      - dependencies
      - ci
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
