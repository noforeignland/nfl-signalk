name: Publish Package

on:
  push:
    tags:
      - 'v*'  # Nur Tags wie v0.1.29 triggern den Publish

permissions:
  id-token: write      # Für OIDC Auth bei npm
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Checkout des Codes
      - uses: actions/checkout@v4

      # Node.js Setup mit npm Registry und OIDC Auth
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          auth-token: ${{ github.token }}  # OIDC-Authentifizierung

      # Abhängigkeiten installieren
      - name: Install dependencies
        run: npm install

      # Tests ausführen, falls vorhanden
      - name: Run tests
        run: npm test --if-present

      # Paket veröffentlichen
      - name: Publish to NPM
        run: npm publish
