name: Publish Package

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Clean up ANY old package.json or build artifacts
      - name: Clean workspace
        run: git clean -xfd

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          scope: '@noforeignland'
          always-auth: true

      - run: npm install

      - run: npm test

      - name: Publish
        run: npm publish --provenance --access public
