name: Publish Package

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Clean workspace
        run: git clean -xfd

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # Ensure npm 11.5.1 or later is installed
      - name: Update npm
        run: npm install -g npm@latest
      - run: npm ci

      - name: Build
        run: |
          npm run build
          echo "Checking dist folder:"
          ls -la dist/

      - run: npm test

      - name: Publish
        run: |
          if [[ "${{ github.ref }}" == refs/tags/*-beta.* ]] || [[ "${{ github.ref }}" == refs/tags/*-rc.* ]]; then
            npm publish --provenance --access public --tag beta
          else
            npm publish --provenance --access public
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          NOTES_FILE="$(mktemp)"
          awk -v v="$VERSION" '
            $0 == v { in_section = 1; next }
            in_section && /^[0-9]+\.[0-9]+\.[0-9]+/ { exit }
            in_section { print }
          ' CHANGELOG.md > "$NOTES_FILE"

          PRERELEASE_FLAG=""
          if [[ "$TAG" == *-beta.* ]] || [[ "$TAG" == *-rc.* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          if [[ -s "$NOTES_FILE" ]]; then
            gh release create "$TAG" --title "$VERSION" --notes-file "$NOTES_FILE" $PRERELEASE_FLAG
          else
            gh release create "$TAG" --title "$VERSION" --generate-notes $PRERELEASE_FLAG
          fi
